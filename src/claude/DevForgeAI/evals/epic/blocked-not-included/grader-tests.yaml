  fail:
  - text: '- FR-008: blocked by DEC-03 (open). Resolve it with /devforgeai:architecture PRD-001.'
    why: superseded resolver not named
  - text: '- FR-008: blocked by DEC-03; ADR-002 is not superseded. Resolve it with /devforgeai:architecture PRD-001.'
    why: negated supersession
  - text: '- FR-008: blocked by DEC-04 (ADR-002 superseded by ADR-003). Resolve it with /devforgeai:architecture PRD-001.'
    why: wrong DEC
  - text: '- FR-008: blocked by DEC-03 (ADR-009 superseded by ADR-003). Resolve it with /devforgeai:architecture PRD-001.'
    why: wrong ADR
  - text: '- FR-008: blocked by DEC-03 (ADR-002 superseded by ADR-003).'
    why: no next action
  - text: '- FR-008: ready: DEC-03 (ADR-002 superseded by ADR-003). Resolve it with /devforgeai:architecture PRD-001.'
    why: contradictory readiness
  - text: '- FR-008: no longer blocked; DEC-03 (ADR-002 superseded) was reopened and settled. Resolve it with /devforgeai:architecture PRD-001.'
    why: negated
