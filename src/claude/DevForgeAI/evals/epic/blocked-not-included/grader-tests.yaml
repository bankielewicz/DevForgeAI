# Independent examples for this case's reply graders (STORY-005, R2-Q1), written by hand, not taken from
# eval replies. Every `pass` text must satisfy its grader (a not_contains grader must not catch it); every
# `fail` text must not. Checked offline before every paid run. The eval itself doesn't read this file.
fr-001-blocked-by-dec-01:
  pass:
  - '- FR-001: blocked by DEC-01 (open). Resolve it with /devforgeai:architecture PRD-001.'
  - '- **FR-001:** blocked, because DEC-01 (which identity provider) is still open. Resolve it with `/devforgeai:architecture PRD-001`.'
  - '| FR-001 | must / current | blocked by DEC-01, which is open | resolve it with /devforgeai:architecture PRD-001 |'
  fail:
  - text: '- FR-001: not blocked; DEC-01 is resolved. Resolve it with /devforgeai:architecture PRD-001.'
    why: negated
  - text: '- FR-001: blocked by DEC-02 (open). Resolve it with /devforgeai:architecture PRD-001.'
    why: wrong DEC
  - text: '- FR-001: blocked by DEC-01 and DEC-02. Resolve it with /devforgeai:architecture PRD-001.'
    why: extra, misattributed DEC
  - text: '- FR-001: blocked by DEC-01 (open).'
    why: no next action
  - text: '- FR-001: blocked. Resolve it with /devforgeai:architecture PRD-001.'
    why: no cause
  - text: '- FR-001: ready; DEC-01 was blocked earlier. Resolve it with /devforgeai:architecture PRD-001.'
    why: contradictory readiness
  - text: '- FR-001: blocked by DEC-010 (open). Resolve it with /devforgeai:architecture PRD-001.'
    why: wrong ID (prefix match)
fr-002-not-blocked:
  pass:
  - '- FR-002 is ready: DEC-02 is resolved by the accepted ADR-001.'
  - '- FR-002 is not blocked: DEC-01 cites only FR-001.'
  - '| FR-002 | must / current | DEC-02 resolved by ADR-001: accepted | none | ready |'
  fail:
  - text: '- FR-002: blocked by DEC-01.'
    why: misattributed blocker
  - text: '- FR-002: unknown: ADR-001 can''t be checked.'
    why: reported unknown
