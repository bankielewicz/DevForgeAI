[workspace]
resolver = "3"

[package]
name = "devforgeai-codex-worker-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "protocol-peer"
path = "tests/support/peer.rs"
test = false

[[bin]]
name = "console-driver"
path = "tests/support/console_driver.rs"
test = false

[[bin]]
name = "crash-driver"
path = "tests/support/crash_driver.rs"
test = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Console", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"
