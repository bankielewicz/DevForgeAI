[workspace]
resolver = "3"

[package]
name = "worker-independent-qa"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "startup-repro"
path = "main.rs"

[[bin]]
name = "synthetic-peer"
path = "peer.rs"

[dependencies]
probe = { package = "devforgeai-codex-worker-probe", path = "C:/Projects/DevForgeAI/devforgeai/experiments/codex-worker-probe" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Console", "Win32_Storage_FileSystem"] }
