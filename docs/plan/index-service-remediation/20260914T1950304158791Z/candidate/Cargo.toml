[workspace]
members = ["."]
resolver = "3"

[package]
name = "devforgeai-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
name = "devforgeai_index"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
clap = { version = "=4.6.6", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "=0.10.9"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
tree-sitter = "=0.26.11"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
ignore = "0.4"
notify = "8"
fs2 = "0.4"
same-file = "=1.0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "=3.27.0"
